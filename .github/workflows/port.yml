name: Port (macOS, Windows)
on:
  push:
    branches: [port-macwin]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  port:
    name: port (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-clap.txt
          python -m pip install --no-deps amqtt==0.12.1
        shell: bash
      - name: pytest
        run: python -m pytest -q tests/test_platform_import.py tests/test_ipc.py tests/test_platform_daemon.py tests/test_platform_gates.py tests/test_platform_audio.py
